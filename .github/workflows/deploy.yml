name: Deploy Staging

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  build-and-deploy-staging:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/lovable
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            E2B_API_KEY=${{ secrets.E2B_API_KEY }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
            INNGEST_EVENT_KEY=${{ secrets.INNGEST_EVENT_KEY }}
            INNGEST_SIGNING_KEY=${{ secrets.INNGEST_SIGNING_KEY }}
            DATABASE_URL=${{ secrets.DATABASE_URL_STAGING }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS (Staging)
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'DEPLOY_EOF'
            set -e
            cd ${{ secrets.VPS_PROJECT_PATH }}

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Set environment variables for staging from GitHub secrets
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            export APP_PORT=${{ secrets.APP_PORT_STAGING }}
            export MYSQL_PORT=${{ secrets.MYSQL_PORT_STAGING }}
            export INNGEST_PORT=${{ secrets.INNGEST_PORT_STAGING }}
            export APP_CONTAINER_NAME=${{ secrets.APP_CONTAINER_NAME_STAGING }}
            export MYSQL_CONTAINER_NAME=${{ secrets.MYSQL_CONTAINER_NAME_STAGING }}
            export INNGEST_CONTAINER_NAME=${{ secrets.INNGEST_CONTAINER_NAME_STAGING }}
            export MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            export MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
            export MYSQL_USER=${{ secrets.MYSQL_USER }}
            export MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
            export DATABASE_URL=${{ secrets.DATABASE_URL_STAGING }}
            export INNGEST_BASE_URL=${{ secrets.INNGEST_BASE_URL_STAGING }}
            export INNGEST_EVENT_KEY=${{ secrets.INNGEST_EVENT_KEY }}
            export INNGEST_SIGNING_KEY=${{ secrets.INNGEST_SIGNING_KEY }}
            export GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            export GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            export E2B_API_KEY=${{ secrets.E2B_API_KEY }}
            export OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            export NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            export CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
            export NEXT_PUBLIC_CLERK_SIGN_IN_URL=${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_URL }}
            export NEXT_PUBLIC_CLERK_SIGN_UP_URL=${{ secrets.NEXT_PUBLIC_CLERK_SIGN_UP_URL }}

            # Stop existing staging services
            docker-compose -f docker-compose.yml down || true

            # Pull the latest image
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/lovable:latest

            # Start services with staging configuration
            docker-compose -f docker-compose.yml up -d

            # Setup nginx configuration for staging
            sudo cp nginx-lovable.conf /etc/nginx/sites-available/lovable
            sudo ln -sf /etc/nginx/sites-available/lovable /etc/nginx/sites-enabled/
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t && sudo systemctl reload nginx

            echo "✅ Staging deployment completed with docker-compose and nginx!"
          DEPLOY_EOF
