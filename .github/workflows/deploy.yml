name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/lovable
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/instructions/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            E2B_API_KEY=${{ secrets.E2B_API_KEY }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS using Blue-Green
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            # Set proper permissions
            sudo chown -R $USER:$USER ${{ secrets.VPS_PROJECT_PATH }} 2>/dev/null || true

            # Navigate to project directory
            cd ${{ secrets.VPS_PROJECT_PATH }}

            # Pull latest changes
            git pull origin main

            # Pull latest image from Docker Hub
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/lovable:latest

            # Create .env.prod file with secrets
            sudo touch .env.prod
            sudo chown $USER:$USER .env.prod
            cat > .env.prod << 'ENVEOF'
          NODE_ENV=production

          # Database Configuration
          MYSQL_CONTAINER_NAME=lovable-mysql-prod
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER=${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          MYSQL_PORT=3306
          DATABASE_URL=${{ secrets.DATABASE_URL }}

          # Application Configuration
          APP_CONTAINER_NAME=lovable-app-prod
          APP_PORT=3000

          # Inngest Configuration
          INNGEST_CONTAINER_NAME=lovable-inngest-prod
          INNGEST_PORT=8288
          INNGEST_DEV=false
          INNGEST_BASE_URL=${{ secrets.INNGEST_BASE_URL }}
          INNGEST_EVENT_KEY=${{ secrets.INNGEST_EVENT_KEY }}
          INNGEST_SIGNING_KEY=${{ secrets.INNGEST_SIGNING_KEY }}

          # API Keys
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          E2B_API_KEY=${{ secrets.E2B_API_KEY }}

          # Clerk Authentication
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL=/sign-in
          NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL=/dashboard
          NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL=/dashboard
          NEXT_PUBLIC_CLERK_SIGN_UP_URL=/sign-up

          # Docker Hub Configuration
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}

          # Deployment Configuration
          DEPLOYMENT_VERSION=${{ github.sha }}
          ENVEOF

            # Make deployment script executable
            chmod +x docker/scripts/deploy-blue-green-automated.sh

            # Run automated blue-green deployment
            ./docker/scripts/deploy-blue-green-automated.sh deploy latest

            echo "🎉 Blue-Green deployment completed successfully!"
            echo "📱 Production App: http://${{ secrets.VPS_HOST }}"
            echo "🔧 Development App: http://${{ secrets.VPS_HOST }}:8080"
          EOF

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment to VPS completed successfully!"
          else
            echo "❌ Deployment to VPS failed!"
          fi
