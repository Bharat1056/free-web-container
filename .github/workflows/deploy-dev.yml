name: Deploy Dev to VPS

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  build-and-deploy-dev:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/lovable-dev
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=dev,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.dev
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            E2B_API_KEY=${{ secrets.E2B_API_KEY }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Dev to VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            # Navigate to project directory
            cd ${{ secrets.VPS_PROJECT_PATH }}

            # Clone repository if it doesn't exist, otherwise pull latest changes
            if [ -d ".git" ]; then
              echo "📁 Repository exists, pulling latest changes..."
              git fetch origin
              git checkout dev
              git pull origin dev
            else
              echo "📁 Repository not found, cloning from GitHub..."
              # Go up one directory to clone
              cd ..
              # Remove empty directory if it exists
              rm -rf $(basename ${{ secrets.VPS_PROJECT_PATH }})
              # Clone the repository
              git clone https://github.com/${{ github.repository }}.git $(basename ${{ secrets.VPS_PROJECT_PATH }})
              # Navigate back to project directory
              cd $(basename ${{ secrets.VPS_PROJECT_PATH }})
              # Checkout dev branch
              git checkout dev
            fi

            # Login to Docker Hub
            echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

            # Create .env.dev file with secrets FIRST
            cat > .env.dev << 'ENVEOF'
NODE_ENV=development

# Database Configuration
MYSQL_CONTAINER_NAME=lovable-mysql-dev
MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
MYSQL_USER=${{ secrets.MYSQL_USER }}
MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
MYSQL_PORT=3307
DATABASE_URL=${{ secrets.DATABASE_URL }}

# Application Configuration
APP_CONTAINER_NAME=lovable-app-dev
APP_PORT=3001

# Inngest Configuration
INNGEST_CONTAINER_NAME=lovable-inngest-dev
INNGEST_PORT=8289
INNGEST_DEV=true
INNGEST_BASE_URL=http://localhost:3001/api/inngest
INNGEST_EVENT_KEY=${{ secrets.INNGEST_EVENT_KEY }}
INNGEST_SIGNING_KEY=${{ secrets.INNGEST_SIGNING_KEY }}

# API Keys
GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
E2B_API_KEY=${{ secrets.E2B_API_KEY }}

# Clerk Authentication
NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}

# Docker Hub Configuration
DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
ENVEOF

            # Debug: Show the .env.dev file contents (without sensitive data)
            echo "📄 Created .env.dev file. Checking contents..."
            echo "File exists: $(ls -la .env.dev)"
            echo "File size: $(wc -l .env.dev)"
            echo "First few lines (non-sensitive):"
            head -5 .env.dev | grep -E "^(NODE_ENV|MYSQL_CONTAINER_NAME|APP_CONTAINER_NAME|INNGEST_CONTAINER_NAME|APP_PORT|MYSQL_PORT|INNGEST_PORT|INNGEST_DEV|INNGEST_BASE_URL)=" || echo "No non-sensitive variables found"

            # Stop existing dev containers (now with env file available)
            docker compose -f docker-compose.dev.yml --env-file .env.dev down

            # Remove old dev images to free up space
            docker system prune -f

            # Pull latest dev image from Docker Hub
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/lovable-dev:dev

            # Start dev containers (no build needed, using pre-built image)
            docker compose -f docker-compose.dev.yml --env-file .env.dev up -d

            # Wait for services to be ready
            echo "Waiting for dev services to start..."
            sleep 30

            # Check service health
            echo "Checking dev service health..."

            # Check if MySQL is ready
            if docker compose -f docker-compose.dev.yml exec -T mysql mysqladmin ping -h localhost --silent; then
              echo "✅ MySQL (dev) is ready"
            else
              echo "❌ MySQL (dev) is not ready"
              exit 1
            fi

            # Check if Next.js app is ready (dev server takes longer to start)
            echo "Waiting for Next.js dev server to start..."
            sleep 20
            if curl -f http://localhost:3001 > /dev/null 2>&1; then
              echo "✅ Next.js app (dev) is ready"
            else
              echo "⏳ Next.js app (dev) is still starting (this is normal for dev mode)"
            fi

            # Check if Inngest is ready
            if curl -f http://localhost:8289 > /dev/null 2>&1; then
              echo "✅ Inngest (dev) is ready"
            else
              echo "❌ Inngest (dev) is not ready"
              exit 1
            fi

            echo "🎉 Dev deployment completed successfully!"
            echo "📱 Next.js App (Dev): http://${{ secrets.VPS_HOST }}:3001"
            echo "⚡ Inngest (Dev): http://${{ secrets.VPS_HOST }}:8289"
            echo "🗄️  MySQL (Dev): ${{ secrets.VPS_HOST }}:3307"
            echo ""
            echo "📋 Dev environment is running with hot reload enabled!"
          EOF

      - name: Notify dev deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Dev deployment to VPS completed successfully!"
          else
            echo "❌ Dev deployment to VPS failed!"
          fi
