name: Deploy Dev to VPS

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  build-and-deploy-dev:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/lovable-dev
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=lates

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.dev
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            E2B_API_KEY=${{ secrets.E2B_API_KEY }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Dev to VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'DEPLOY_EOF'
            # Set proper permissions and create directories
            sudo chown -R $USER:$USER ${{ secrets.VPS_PROJECT_PATH }} 2>/dev/null || true

            cd ${{ secrets.VPS_PROJECT_PATH }}

            if [ -d ".git" ]; then
              echo "📁 Repository exists, pulling latest changes..."
              git fetch origin
              git checkout dev
              git pull origin dev
            else
              echo "📁 Repository not found, cloning from GitHub..."
              cd ..
              rm -rf $(basename ${{ secrets.VPS_PROJECT_PATH }})
              git clone https://github.com/${{ github.repository }}.git $(basename ${{ secrets.VPS_PROJECT_PATH }})
              cd $(basename ${{ secrets.VPS_PROJECT_PATH }})
              git checkout dev
            fi

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            echo "🔍 Detecting current active environment..."
            CURRENT_ACTIVE="blue"

            if docker ps --format "{{.Names}}" | grep -q "lovable-app-blue-dev"; then
              CURRENT_ACTIVE="blue"
            elif docker ps --format "{{.Names}}" | grep -q "lovable-app-green-dev"; then
              CURRENT_ACTIVE="green"
            fi

            if [ "$CURRENT_ACTIVE" = "blue" ]; then
              TARGET_COLOR="green"
              TARGET_PORT="3001"
              echo "🎯 Deploying to: GREEN environment (port $TARGET_PORT)"
            else
              TARGET_COLOR="blue"
              TARGET_PORT="3000"
              echo "🎯 Deploying to: BLUE environment (port $TARGET_PORT)"
            fi

            sudo touch .env.dev
            sudo chown $USER:$USER .env.dev
            cat > .env.dev << ENV_EOF
          NODE_ENV=development
          MYSQL_CONTAINER_NAME=lovable-mysql-$TARGET_COLOR-dev
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER=${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          MYSQL_PORT=3307
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          APP_CONTAINER_NAME=lovable-app-$TARGET_COLOR-dev
          APP_PORT=$TARGET_PORT
          INNGEST_CONTAINER_NAME=lovable-inngest-$TARGET_COLOR-dev
          INNGEST_PORT=8289
          INNGEST_DEV=true
          INNGEST_BASE_URL=http://localhost:$TARGET_PORT/api/inngest
          INNGEST_EVENT_KEY=${{ secrets.INNGEST_EVENT_KEY }}
          INNGEST_SIGNING_KEY=${{ secrets.INNGEST_SIGNING_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          E2B_API_KEY=${{ secrets.E2B_API_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL=/sign-in
          NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL=/dashboard
          NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL=/dashboard
          NEXT_PUBLIC_CLERK_SIGN_UP_URL=/sign-up
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          ENV_EOF

            if [ -f .env.dev ]; then
              head -5 .env.dev || echo "ℹ️  .env.dev created but no preview available"
            else
              echo "❌ .env.dev file was not created!"
              exit 1
            fi

            echo "📥 Pulling commit-specific dev image..."
            docker pull "${{ secrets.DOCKERHUB_USERNAME }}/lovable-dev:${{ github.sha }}"

            chmod +x docker/scripts/deploy-blue-green-automated.sh
            ./docker/scripts/deploy-blue-green-automated.sh deploy dev $TARGET_COLOR ${{ github.sha }}

            echo ""
            echo "📱 Development App: http://${{ secrets.VPS_HOST }}:8080"
            echo ""
            echo "📋 Dev environment is running with zero-downtime deployment!"
          DEPLOY_EOF

      - name: Notify dev deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Dev deployment to VPS completed successfully!"
          else
            echo "❌ Dev deployment to VPS failed!"
            exit 1
          fi
