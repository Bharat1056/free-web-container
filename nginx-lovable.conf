# ================== PROD ==================
server {
    listen 80;
    server_name vibe.bharatpanigrahi.com www.vibe.bharatpanigrahi.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vibe.bharatpanigrahi.com www.vibe.bharatpanigrahi.com;

    ssl_certificate /etc/letsencrypt/live/vibe.bharatpanigrahi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibe.bharatpanigrahi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # App
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # Health
    location /api/health {
        proxy_pass http://127.0.0.1:3000/api/health;
    }

    # Inngest → choose one:
    # If SDK route in Next.js:
    location /api/inngest {
        proxy_pass http://127.0.0.1:3000/api/inngest;
    }
    # If dev server:
    # location /api/inngest {
    #     proxy_pass http://127.0.0.1:8288;
    # }

    # tRPC with WebSocket
    location /api/trpc {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

